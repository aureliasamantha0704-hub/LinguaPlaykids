<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bookPages" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Sparkle rays around star -->
  <line x1="12" y1="20" x2="6" y2="18" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
  <line x1="15" y1="13" x2="11" y2="8" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="8" x2="32" y2="2" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
  <line x1="49" y1="13" x2="53" y2="8" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
  <line x1="52" y1="20" x2="58" y2="18" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cute Star Mascot Body -->
  <path
    d="M 32 6 
       C 33.5 10, 36 15, 39 17 
       C 43 18, 51 18, 53 20 
       C 54 22, 51 28, 48 31 
       C 47 34, 49 41, 47 43 
       C 45 44, 38 41, 35 41 
       C 33 42, 29 42, 27 41 
       C 24 41, 17 44, 15 43 
       C 13 41, 15 34, 14 31 
       C 11 28, 8 22, 9 20 
       C 11 18, 19 18, 23 17 
       C 26 15, 28.5 10, 32 6 Z"
    fill="url(#starGrad)"
    stroke="#d97706"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Star Cute Face -->
  <!-- Eyes -->
  <circle cx="26" cy="25" r="2.2" fill="#1e293b" />
  <circle cx="25.3" cy="24.3" r="0.7" fill="#ffffff" />
  <circle cx="38" cy="25" r="2.2" fill="#1e293b" />
  <circle cx="37.3" cy="24.3" r="0.7" fill="#ffffff" />

  <!-- Rosy Cheeks -->
  <ellipse cx="21" cy="28" rx="2.5" ry="1.5" fill="#f87171" opacity="0.6" />
  <ellipse cx="43" cy="28" rx="2.5" ry="1.5" fill="#f87171" opacity="0.6" />

  <!-- Cute Smile -->
  <path d="M 29.5 28 Q 32 32 34.5 28" fill="#1e293b" stroke="#1e293b" stroke-width="1" stroke-linecap="round" />

  <!-- Open Purple Book -->
  <!-- Left cover -->
  <path d="M 32 40 L 14 34 L 12 48 L 32 55 Z" fill="url(#bookCover)" stroke="#4338ca" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Right cover -->
  <path d="M 32 40 L 50 34 L 52 48 L 32 55 Z" fill="url(#bookCover)" stroke="#4338ca" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Left pages -->
  <path d="M 32 39 L 15 33 L 13.5 46.5 L 32 53.5 Z" fill="url(#bookPages)" />
  <!-- Right pages -->
  <path d="M 32 39 L 49 33 L 50.5 46.5 L 32 53.5 Z" fill="url(#bookPages)" />
  <!-- Book spine line -->
  <line x1="32" y1="39" x2="32" y2="55" stroke="#4338ca" stroke-width="1.5" />

  <!-- Little Hands holding the book -->
  <circle cx="15" cy="40" r="2.5" fill="#facc15" stroke="#d97706" stroke-width="0.8" />
  <circle cx="49" cy="40" r="2.5" fill="#facc15" stroke="#d97706" stroke-width="0.8" />
</svg>
