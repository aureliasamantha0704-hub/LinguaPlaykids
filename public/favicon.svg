<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9EA" />
      <stop offset="100%" stop-color="#FFEBB8" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE76A" />
      <stop offset="100%" stop-color="#FFD438" />
    </linearGradient>
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A48BE8" />
      <stop offset="100%" stop-color="#886BDB" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EBE6FB" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#735da5" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Squircle Base Container with Soft Glow -->
  <rect x="3" y="3" width="114" height="114" rx="30" ry="30" fill="url(#bgGrad)" stroke="#FFD858" stroke-width="2.5" />

  <!-- Star Character with Sparkles and Book -->
  <g transform="translate(6, 6)" filter="url(#shadow)">
    <!-- Yellow Sparkle Rays -->
    <path d="M 16 38 L 8 42" stroke="#FFCE34" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 22 25 L 14 20" stroke="#FFCE34" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 54 13 L 53 4" stroke="#FFCE34" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 68 20 L 75 11" stroke="#FFCE34" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 94 36 L 102 32" stroke="#FFCE34" stroke-width="3.5" stroke-linecap="round" />

    <!-- Cute Chubby 5-Pointed Star -->
    <path d="
      M 54 18
      C 58 26, 63 35, 70 38
      C 79 41, 88 41, 91 50
      C 94 57, 86 64, 84 72
      C 81 80, 83 89, 76 94
      C 70 98, 62 93, 54 94
      C 47 93, 38 98, 32 94
      C 26 89, 28 80, 25 72
      C 22 64, 15 57, 18 50
      C 21 41, 30 41, 38 38
      C 45 35, 50 26, 54 18 Z"
      fill="url(#starGrad)"
    />

    <!-- Star Eyes -->
    <ellipse cx="46" cy="56" rx="3.2" ry="4.2" fill="#201C2B" />
    <circle cx="45" cy="54.2" r="1.5" fill="#FFFFFF" />
    <circle cx="47" cy="57.5" r="0.6" fill="#FFFFFF" />

    <ellipse cx="64" cy="56" rx="3.2" ry="4.2" fill="#201C2B" />
    <circle cx="63" cy="54.2" r="1.5" fill="#FFFFFF" />
    <circle cx="65" cy="57.5" r="0.6" fill="#FFFFFF" />

    <!-- Smile Mouth with Tongue -->
    <path d="M 51 61 C 52 67, 58 67, 59 61 Z" fill="#201C2B" />
    <path d="M 52.5 64 C 53.5 67, 56.5 67, 57.5 64 Z" fill="#FF708C" />

    <!-- Rosy Cheeks -->
    <ellipse cx="38" cy="60" rx="4.5" ry="3.2" fill="#FFA8B6" />
    <ellipse cx="72" cy="60" rx="4.5" ry="3.2" fill="#FFA8B6" />

    <!-- Open Lavender Book in Front -->
    <g transform="translate(1, 0)">
      <!-- Left Outer Cover -->
      <path d="M 16 71 C 24 57, 43 61, 54 69 L 54 100 C 43 92, 24 89, 16 102 Z" fill="#886CDA" />
      <!-- Left Pages -->
      <path d="M 19 70 C 26 59, 44 62, 54 69 L 54 97 C 44 90, 26 88, 19 99 Z" fill="url(#pageGrad)" />
      <!-- Right Outer Cover -->
      <path d="M 92 71 C 84 57, 65 61, 54 69 L 54 100 C 65 92, 84 89, 92 102 Z" fill="#886CDA" />
      <!-- Right Pages -->
      <path d="M 89 70 C 82 59, 64 62, 54 69 L 54 97 C 64 90, 82 88, 89 99 Z" fill="url(#pageGrad)" />
      <!-- Center Crease -->
      <path d="M 53.5 68.5 L 54.5 69 L 54.5 98.5 L 53.5 98 Z" fill="#7154CA" />
    </g>
  </g>
</svg>
